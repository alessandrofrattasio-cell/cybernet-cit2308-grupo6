<!DOCTYPE html>
<html lang="es">
<head>
   <link rel="manifest" href="manifest.json">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Servicios adicionales | CyberNet</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
      <h1>Servicios adicionales</h1>
   </header>

   <main x-data="serviciosController(window.serviciosService)" class="contenedor-servicios">
    <div x-show="estado === 'cargando'" class="estado-cargando">
        <p>Cargando servicios...</p>
    </div>

    <div x-show="estado === 'error'" class="estado-error" x-cloak>
        <p x-text="mensajeError"></p>
        <button @click="cargarDatos()">Reintentar</button>
    </div>

    <div x-show="estado === 'vacio'" class="estado-vacio" x-cloak>
        <p>No hay servicios registrados actualmente.</p>
    </div>

    <div x-show="estado === 'normal'" class="estado-normal" x-cloak>
        <form @submit.prevent="guardarNuevo()" class="formulario-servicios">
            <input type="text" x-model="formulario.computador" placeholder="Nombre del equipo" required>
            <input type="text" x-model="formulario.servicio" placeholder="Tipo de servicio" required>
            <input type="number" x-model="formulario.cantidad" min="1" required>
            <button type="submit">Agregar Servicio</button>
        </form>

        <ul class="lista-servicios">
            <template x-for="item in listaServicios" :key="item.id">
                <li>
                    <span x-text="item.computador + ' - ' + item.servicio + ' (x' + item.cantidad + ')'"></span>
                    <button @click="borrar(item.id)">Eliminar</button>
                </li>
            </template>
        </ul>
    </div>
   </main>

   <footer>
      <p>CyberNet - Plataforma para administrar un cibercafé</p>
   </footer>

   
   <script type="module" src="js/app.js"></script>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
