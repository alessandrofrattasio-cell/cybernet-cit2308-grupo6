<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Servicios adicionales | CyberNet</title>
   <link rel="stylesheet" href="resumen.css">
   <script src="servicios.js" defer></script>
</head>
<body>
   <header>
      <h1>Servicios adicionales</h1>
      <nav class="menu">
         <a href="login.html">Login</a>
         <a href="register.html">Registro</a>
         <a href="computadores.html">Computadores</a>
         <a href="clientes.html">Clientes</a>
         <a href="servicios.html">Servicios</a>
         <a href="historial.html">Historial</a>
         <a href="resumen.html">Resumen</a>
      </nav>
   </header>

   <main>
      <section>
         <h2>Agregar servicio</h2>
         <form>
            <label for="computador">Computador:</label>
            <select id="computador" name="computador" required>
               <option value="">Selecciona un computador</option>
               <option value="pc01">Computador 01</option>
               <option value="pc02">Computador 02</option>
            </select>

            <label for="servicio">Servicio:</label>
            <select id="servicio" name="servicio" required>
               <option value="">Selecciona un servicio</option>
               <option value="impresion">Impresión</option>
               <option value="bebida">Bebida</option>
               <option value="snack">Snack</option>
            </select>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>

            <button type="submit">Agregar servicio</button>
         </form>
      </section>

      <section>
         <h2>Servicios agregados</h2>
         <ul id="lista-servicios"></ul>
      </section>
   </main>

   <footer>
      <p>CyberNet - Plataforma para administrar un cibercafé</p>
   </footer>
</body>
</html>
