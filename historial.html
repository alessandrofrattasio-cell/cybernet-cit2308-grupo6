<!DOCTYPE html>
<html lang="es">
<head>
   <link rel="manifest" href="manifest.json">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Historial de sesiones | CyberNet</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
      <h1>Historial de sesiones</h1>
   </header>

   <main x-data="historialController(window.sesionesService)" class="contenedor-historial">
    <div x-show="estado === 'cargando'">Cargando historial...</div>
    <div x-show="estado === 'error'" x-cloak>Error al cargar el historial.</div>
    <div x-show="estado === 'vacio'" x-cloak>No hay sesiones registradas.</div>
    
    <div x-show="estado === 'normal'" x-cloak>
        <ul class="lista-historial">
            <template x-for="sesion in sesiones" :key="sesion.id">
                <li>
                    <span x-text="'Equipo: ' + sesion.computador + ' - Inicio: ' + sesion.horaInicio + ' - Fin: ' + (sesion.horaFin || 'En curso')"></span>
                </li>
            </template>
        </ul>
    </div>
</main>

   <footer>
      <p>CyberNet - Plataforma para administrar un cibercafé</p>
   </footer>
</body>
</html>
