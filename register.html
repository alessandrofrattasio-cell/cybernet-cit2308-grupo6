<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <title>Crear cuenta de encargado</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
   </head>
   <body>
      <header>
         <p>CyberNet</p>
      </header>
      <main>
         <h1>Crear cuenta de encargado</h1>
         <form action="login.html" method="get">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            <label for="rut">RUT:</label>
            <input type="text" id="rut" name="rut" placeholder="12345678-9" pattern="[0-9]{7,8}-[0-9Kk]" title="Escribe un RUT como 12345678-9" required>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="********" required>

            <button type="submit">Registrarse</button>
         </form>

         <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </main>
      <footer>
         <p>CyberNet - Plataforma para administrar un cibercafé</p>
      </footer>
   </body>
</html>
