<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen | Cyber-Cafe</title>
    <link rel="stylesheet" href="style.css">

    <script src="js/conexionController.js" defer></script>
    <script src="js/registrarServiceWorker.js" defer></script>
    <script src="js/repositorio.js" defer></script>
    <script src="js/sesionRepository.js" defer></script>
    <script src="js/sesionsService.js" defer></script>
    <script src="js/resumen.controller.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body>
   <header>
      <h1>Resumen de actividad</h1>
      <nav class="menu">
         <a href="login.html">Login</a>
         <a href="register.html">Registro</a>
         <a href="computadores.html">Computadores</a>
         <a href="clientes.html">Clientes</a>
         <a href="servicios.html">Servicios</a>
         <a href="historial.html">Historial</a>
         <a href="resumen.html" class="activo" >Resumen</a>
      </nav>
   </header>

   <main x-data="resumenController(window.sesionesService)" class="contenedor-resumen">
    <div x-show="estado === 'cargando'">Calculando resumen...</div>
    <div x-show="estado === 'error'" x-cloak>Error al cargar el resumen.</div>
    <div x-show="estado === 'vacio'" x-cloak>No hay datos para el resumen de hoy.</div>
    
    <div x-show="estado === 'normal'" x-cloak>
        <div class="tarjeta-resumen">
            <h3>Total Recaudado: $<span x-text="resumen?.totalDinero"></span></h3>
            <p>Sesiones terminadas: <span x-text="resumen?.totalSesiones"></span></p>
        </div>
    </div>
   </main>

   <footer>
      <p>CyberNet - Plataforma para administrar un cibercafé</p>
   </footer>

</body>
</html>
