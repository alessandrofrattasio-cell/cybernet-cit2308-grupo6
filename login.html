<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <title>Iniciar Sesión</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
      <link rel="manifest" href="manifest.json">
      <script src="js/repositorio.js" defer></script>
      <script src="js/usuarioRepository.js" defer></script>
      <script src="js/usuarioService.js" defer></script>
      <script src="js/usuarioController.js" defer></script>
      <script src="js/conexionController.js" defer></script>
      <script src="js/registrarServiceWorker.js" defer></script>
      <script src="js/app.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
   </head>
   <body class="pagina-auth">
      <p x-data="estadoConexion" x-init="iniciar()" x-show="sinConexion" role="status">Sin conexión. La aplicación está usando los archivos guardados.</p>
      <header>
         <p>CyberNet</p>
         <nav class="menu">
            <a href="login.html" class="activo">Login</a>
            <a href="register.html">Registro</a>
            <a href="computadores.html">Computadores</a>
            <a href="clientes.html">Clientes</a>
            <a href="servicios.html">Servicios</a>
            <a href="historial.html">Historial</a>
            <a href="resumen.html">Resumen</a>
         </nav>
      </header>
      <main>
         <h1>Iniciar Sesión</h1>
         <form x-data="formularioLoginUsuarios" @submit.prevent="iniciarSesion()">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" x-model="nombreUsuario" required>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="********" x-model="contrasena" required>

            <p x-show="cargando" role="status">Iniciando sesión...</p>
            <p x-show="error" x-text="error" role="alert"></p>
            <p x-show="mensaje" x-text="mensaje" role="status"></p>
            <p x-show="usuarioActivo"><a href="computadores.html">Ir a computadores</a></p>
            <button type="submit" :disabled="cargando">Iniciar Sesión</button>
         </form>
         <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      </main>
      <footer>
         <p>CyberNet - Plataforma para administrar un cibercafé</p>
      </footer>
   </body>
</html>
